AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: High-Scale Ledger Engine - Core Infrastructure (Synchronous Flow)

# --- GLOBAL CONFIGURATIONS ---
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        LEDGER_TABLE: { Ref: LedgerTable }
        METRICS_NAMESPACE: "PaymentProcessor"

Resources:
  # =========================================================================
  # 1. DYNAMODB: CORE DATA STORE
  # =========================================================================
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HighScaleLedgerCore
      
      # --- FINOPS: On-demand scaling for cost optimization ---
      BillingMode: PAY_PER_REQUEST 
      
      # --- SINGLE-TABLE DESIGN MODELING ---
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

      # --- EVENT-DRIVEN CAPABILITIES ---
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      # --- ENTERPRISE SECURITY: Encryption at rest ---
      SSESpecification:
        SSEEnabled: true

  # =========================================================================
  # 2. LAMBDA PROCESSOR: SYNCHRONOUS FLOW
  # =========================================================================
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/processor.handler
      Tracing: Active
      Description: Core engine for ACID transactions and idempotency checks.
      
      # --- IAM LEAST PRIVILEGE POLICIES ---
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem        # Required for Idempotency Lock
                - dynamodb:UpdateItem     # Required for Debit/Credit logic
                - dynamodb:GetItem
                - dynamodb:TransactWriteItems # Required for Atomic Transactions
              Resource: { "Fn::GetAtt": ["LedgerTable", "Arn"] }

        # SAM Managed Policy to allow pushing metrics to CloudWatch
        - CloudWatchPutMetricPolicy: {}
        - AWSXRayDaemonWriteAccess

      # --- INGRESS: API GATEWAY ---
      Events:
        PostPayment:
          Type: Api
          Properties:
            Path: /payments
            Method: post

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        External:
          - "@aws-sdk/*"
        EntryPoints: 
          - src/handlers/processor.js


  # =========================================================================
  # 3. STREAM POLLER: ASYNC EVENT DISPATCHER
  # =========================================================================
  StreamPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/stream-poller.handler
      Tracing: Active
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: "HighScaleTransactionEvents" 
        - AWSXRayDaemonWriteAccess
        - CloudWatchPutMetricPolicy: {}

      Environment:
        Variables:
          SNS_TOPIC_ARN: { Ref: TransactionEventsTopic }

      Events:
        LedgerStream:
          Type: DynamoDB
          Properties:
            Stream: { "Fn::GetAtt": ["LedgerTable", "StreamArn"] }
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"SK":{"S":[{"prefix":"TX#"}]}},"NewImage":{"status":{"S":["SUCCESS"]}}}}'

  # =========================================================================
  # 4. SNS TOPIC: CENTRAL EVENT BUS
  # =========================================================================
  TransactionEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "HighScaleTransactionEvents"
      KmsMasterKeyId: "alias/aws/sns"

  
  # =========================================================================
  # 5. ASYNC WORKER: SQS + DLQ + NOTIFICATION LAMBDA
  # =========================================================================
  PaymentNotificationDLQ:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "PaymentNotificationDLQ"

  PaymentNotificationQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "PaymentNotificationQueue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: { "Fn::GetAtt": ["PaymentNotificationDLQ", "Arn"] }
        maxReceiveCount: 3

  NotificationSubscription:
    Type: "AWS::SNS::Subscription"
    Properties:
      TopicArn: { "Ref": "TransactionEventsTopic" }
      Endpoint: { "Fn::GetAtt": ["PaymentNotificationQueue", "Arn"] }
      Protocol: "sqs"
      RawMessageDelivery: true

  NotificationFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      CodeUri: .
      Handler: src/handlers/notification-worker.handler
      Runtime: nodejs24.x
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: { "Fn::GetAtt": ["PaymentNotificationQueue", "Arn"] }
            BatchSize: 5
            
  # =========================================================================
  # 6. OBSERVABILITY: DLQ ALARM
  # =========================================================================
    NotificationDLQAlarm:
      Type: "AWS::CloudWatch::Alarm"
      Properties:
        AlarmDescription: "Grita se houver mensagens falhas na DLQ de Notificação"
        Namespace: "AWS/SQS"
        MetricName: "ApproximateNumberOfMessagesVisible"
        Dimensions:
          - Name: "QueueName"
            Value: !GetAtt PaymentNotificationDLQ.QueueName
        Statistic: "Sum"
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: "GreaterThanOrEqualToThreshold"
        TreatMissingData: "notBreaching"           

# =========================================================================
# 7. STACK OUTPUTS: EXPOSING RESOURCES FOR EXTERNAL INTEGRATION
# =========================================================================
Outputs:
  LedgerTableStreamArn:
    Description: "The ARN of the DynamoDB Stream for downstream processing."
    Value: { "Fn::GetAtt": ["LedgerTable", "StreamArn"] }
    Export:
      Name: 
        "Fn::Join": [ "-", [ { "Ref": "AWS::StackName" }, "StreamArn" ] ]

  TransactionEventsTopicArn:
    Description: "The ARN of the SNS Topic for event-driven fan-out."
    Value: { Ref: TransactionEventsTopic }
    Export:
      Name: 
        "Fn::Join": [ "-", [ { "Ref": "AWS::StackName" }, "TopicArn" ] ]

  ProcessorApiUrl:
    Description: "The base URL for the synchronous Ledger API."
    Value: 
      "Fn::Join": 
        - ""
        - - "https://"
          - { "Ref": "ServerlessRestApi" }
          - ".execute-api."
          - { "Ref": "AWS::Region" }
          - ".amazonaws.com/Prod/payments"
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: High-Scale Ledger Engine - Core Infrastructure (Synchronous Flow)

# --- GLOBAL CONFIGURATIONS ---
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 512
    Environment:
      Variables:
        LEDGER_TABLE: { Ref: LedgerTable }
        METRICS_NAMESPACE: "PaymentProcessor"

Resources:
  # =========================================================================
  # 1. DYNAMODB: CORE DATA STORE
  # =========================================================================
  LedgerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HighScaleLedgerCore
      
      # --- FINOPS: On-demand scaling for cost optimization ---
      BillingMode: PAY_PER_REQUEST 
      
      # --- SINGLE-TABLE DESIGN MODELING ---
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

      # --- EVENT-DRIVEN CAPABILITIES ---
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

      # --- ENTERPRISE SECURITY: Encryption at rest ---
      SSESpecification:
        SSEEnabled: true

  # =========================================================================
  # 2. LAMBDA PROCESSOR: SYNCHRONOUS FLOW
  # =========================================================================
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/processor.handler
      Tracing: Active
      Description: Core engine for ACID transactions and idempotency checks.
      
      # --- IAM LEAST PRIVILEGE POLICIES ---
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref LedgerTable }
        - AWSXrayWriteOnlyAccess
        - CloudWatchPutMetricPolicy: {}

      # --- INGRESS: API GATEWAY ---
      Events:
        PostPayment:
          Type: Api
          Properties:
            Path: /payments
            Method: post

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        External:
          - "@aws-sdk/*"
        EntryPoints: 
          - src/handlers/processor.js


  # =========================================================================
  # 3. STREAM POLLER: ASYNC EVENT DISPATCHER
  # =========================================================================
  StreamPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/handlers/stream-poller.handler
      Tracing: Active
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: "HighScaleTransactionEvents" 
        - AWSXrayWriteOnlyAccess
        - CloudWatchPutMetricPolicy: {}

      Environment:
        Variables:
          SNS_TOPIC_ARN: { Ref: TransactionEventsTopic }

      Events:
        LedgerStream:
          Type: DynamoDB
          Properties:
            Stream: { "Fn::GetAtt": ["LedgerTable", "StreamArn"] }
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"dynamodb":{"Keys":{"SK":{"S":[{"prefix":"TX#"}]}},"NewImage":{"status":{"S":["SUCCESS"]}}}}'

    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        External:
          - "@aws-sdk/*"
        EntryPoints: 
          - src/handlers/stream-poller.js
  # =========================================================================
  # 4. SNS TOPIC: CENTRAL EVENT BUS
  # =========================================================================
  TransactionEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "HighScaleTransactionEvents"
      KmsMasterKeyId: "alias/aws/sns"

  
  # =========================================================================
  # 5. ASYNC WORKER: SQS + DLQ + NOTIFICATION LAMBDA
  # =========================================================================
  PaymentNotificationDLQ:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "PaymentNotificationDLQ"

  PaymentNotificationQueue:
    Type: "AWS::SQS::Queue"
    Properties:
      QueueName: "PaymentNotificationQueue"
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: { "Fn::GetAtt": ["PaymentNotificationDLQ", "Arn"] }
        maxReceiveCount: 3

  PaymentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - { Ref: PaymentNotificationQueue }
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: "sns.amazonaws.com"
            Action: "sqs:SendMessage"
            Resource: { "Fn::GetAtt": ["PaymentNotificationQueue", "Arn"] }
            Condition:
              ArnEquals:
                "aws:SourceArn": { Ref: TransactionEventsTopic }

  NotificationSubscription:
    Type: "AWS::SNS::Subscription"
    Properties:
      TopicArn: { "Ref": "TransactionEventsTopic" }
      Endpoint: { "Fn::GetAtt": ["PaymentNotificationQueue", "Arn"] }
      Protocol: "sqs"
      RawMessageDelivery: true

  NotificationFunction:
    Type: "AWS::Serverless::Function"
    Properties:
      CodeUri: .
      Handler: src/handlers/notification-worker.handler
      Tracing: Active
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref LedgerTable }
        - AWSXrayWriteOnlyAccess
        - CloudWatchPutMetricPolicy: {}
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: { "Fn::GetAtt": ["PaymentNotificationQueue", "Arn"] }
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
    
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "node24"
        External:
          - "@aws-sdk/*"
        EntryPoints: 
          - src/handlers/notification-worker.js

  # =========================================================================
  # 6. OBSERVABILITY: DLQ ALARM
  # =========================================================================
  NotificationDLQAlarm:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmDescription: "Shout if there are failed messages in the Notification DLQ."
      Namespace: "AWS/SQS"
      MetricName: "ApproximateNumberOfMessagesVisible"
      Dimensions:
        - Name: "QueueName"
          Value: { "Fn::GetAtt": ["PaymentNotificationDLQ", "QueueName"] }
      Statistic: "Sum"
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      TreatMissingData: "notBreaching"


  # =========================================================================
  # 7. OBSERVABILITY: OPERATIONAL DASHBOARD
  # =========================================================================
  LedgerOperationalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-Operational-Dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${StreamPollerFunction}", { "label": "Poller Invocations" } ],
                  [ ".", "Errors", ".", ".", { "label": "Poller Errors", "color": "#d62728" } ],
                  [ ".", "Invocations", "FunctionName", "${NotificationFunction}", { "label": "Worker Invocations" } ],
                  [ ".", "Errors", ".", ".", { "label": "Worker Errors", "color": "#ff7f0e" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Lambda Activity: Poller vs Worker"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${PaymentNotificationQueue.QueueName}", { "label": "Main Queue Depth" } ],
                  [ ".", "ApproximateNumberOfMessagesVisible", "QueueName", "${PaymentNotificationDLQ.QueueName}", { "label": "DLQ Depth", "color": "#d62728" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "SQS Queue Depth (Backlog & DLQ)"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 24, "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Duration", "FunctionName", "${NotificationFunction}", { "stat": "Average", "label": "Avg Duration" } ],
                  [ "...", { "stat": "p99", "label": "p99 Duration" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Notification Worker Latency (ms)"
              }
            }
          ]
        }

# =========================================================================
# 8. STACK OUTPUTS: EXPOSING RESOURCES FOR EXTERNAL INTEGRATION
# =========================================================================
Outputs:
  LedgerTableStreamArn:
    Description: "The ARN of the DynamoDB Stream for downstream processing."
    Value: { "Fn::GetAtt": ["LedgerTable", "StreamArn"] }
    Export:
      Name: 
        "Fn::Join": [ "-", [ { "Ref": "AWS::StackName" }, "StreamArn" ] ]

  TransactionEventsTopicArn:
    Description: "The ARN of the SNS Topic for event-driven fan-out."
    Value: { Ref: TransactionEventsTopic }
    Export:
      Name: 
        "Fn::Join": [ "-", [ { "Ref": "AWS::StackName" }, "TopicArn" ] ]

  ProcessorApiUrl:
    Description: "The base URL for the synchronous Ledger API."
    Value: 
      "Fn::Join": 
        - ""
        - - "https://"
          - { "Ref": "ServerlessRestApi" }
          - ".execute-api."
          - { "Ref": "AWS::Region" }
          - ".amazonaws.com/Prod/payments"